name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # TODO(R5): switch to `npm ci` once package-lock.json is committed
      # for reproducible installs.
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
